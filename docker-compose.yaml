
# базовый шаблон для образа
x-base-app: &base_app
  build: .
  env_file: .env
  volumes:
    - .:/app
  depends_on:
    - postgres
    - redis

services:

  # приложение
  my_app:
    <<: *base_app
    container_name: fastapi-app
    ports:
      - "8000:8000"
    command: uv run -m source.main --uvicorn_reload

  # celery для выполнения задач
  celery_worker:
    <<: *base_app
    command: uv run celery -A source.celery_app.celery_app worker --loglevel=info
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0

  # celery для периодичных задач
  celery_beat:
    <<: *base_app
    command: uv run celery -A source.celery_app.celery_app beat --loglevel=info
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0

  postgres:
    image: postgres:17
    container_name: pg-container
    env_file: .env
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis
    env_file: .env
    ports:
      - "${REDIS_PORT}:6379"

volumes:
  postgres_data: