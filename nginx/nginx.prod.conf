server {
    listen 80;
    server_name localhost;


    # Gzip сжатие
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;


    # 1. ПРЯМАЯ раздача загруженных файлов через Nginx
    location /api/v1/app/uploads/ {

        alias /app/uploads/; 
        
        expires 7d; # Кэшировать в браузере на 7 дней
        add_header Cache-Control "public, no-transform";
    }

    # 2. Проксирование админки
    location ^~ /admin/ {
        proxy_pass http://my_app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 3. Проксирование API-запросов на FastAPI
    location /api/ {
        proxy_pass http://my_app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 4. Frontend proxy
    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

}